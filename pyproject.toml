[project]
name = "offline-wikipedia-rag"
version = "1.1.0"
description = "Chat with offline English Wikipedia through local Ollama models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6",
    "beautifulsoup4",
    "requests",
    "libzim>=3.13.0",
    "lxml>=6.1.3",
    "usearch>=2.26.2",
    "numpy>=2.2.6",
]

[dependency-groups]
dense-build = [
    "torch>=2.14.1",
    "transformers>=5.18.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[tool.uv]
package = false
