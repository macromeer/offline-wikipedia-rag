[project]
name = "offline-wikipedia-rag"
version = "1.1.0"
description = "Chat with offline English Wikipedia through local Ollama models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6",
    "beautifulsoup4",
    "requests",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[tool.uv]
package = false
